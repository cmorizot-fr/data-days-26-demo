[project]
name = "paris-data-summit-2026-demo"
version = "0.1.0"
description = "Paris Data Summit 2026 — Agentic Data Cloud Bank Demo & Deterministic Data Generator"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "polars>=1.9.0",
    "pyarrow>=18.0.0,<24.0.0",
    "duckdb>=1.1.0",
    "numpy>=2.1.0",
    "reportlab>=4.2.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[tool.uv]
python-preference = "only-system"
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.ruff]
line-length = 100
target-version = "py311"
