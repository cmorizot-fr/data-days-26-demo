        description: "Maître des comptes Mainframe (94 350 comptes) avec solde de la veille."
      - name: cbk_cfonb_movements
        description: "Mouvements CFONB 120 sur 18 mois (5,5 M) — 1,2 % de dates de valeur 00000000 / 99999999."
      - name: cbk_cfonb_balances
        description: "Soldes CFONB 120 (lignes 01 / 07)."
      - name: aws_crm_customers
        description: "Clients du CRM SaaS AWS (80 000, dont 650 créés après le batch Mainframe J-1)."
      - name: aws_crm_account_portfolio
        description: "Portefeuille de comptes du CRM AWS (95 000)."
      - name: aws_crm_interactions
        description: "RDV agences & verbatims call center (320 000)."
      - name: raw_sepa_payments_unified
