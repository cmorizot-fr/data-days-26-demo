      - name: raw_iban_events_unified
        description: "Ajouts de bénéficiaires IBAN : historique + flux temps réel Pub/Sub."
      - name: raw_sap_gl_alm
        description: "Grand livre d'écart PNB SAP / PCEC & dépôts TCI ALM (1 200 000 lignes)."
      - name: raw_promo_contracts_pdf
        description: "Object Table des 250 avenants promotionnels PDF (Dataplex Discovery)."
      - name: raw_cfo_regulatory_pdf
        description: "Object Table des 6 PDF réglementaires CFO."
