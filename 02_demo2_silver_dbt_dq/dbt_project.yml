name: 'hexagone_bank_lakehouse'
version: '1.0.0'
config-version: 2

profile: 'data_days_demo_bq'

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Attribution des jobs BigQuery (labels datacloud:antigravity sur chaque requête dbt)
query-comment:
  comment: '{"datacloud": "antigravity", "app": "dbt", "project": "hexagone_bank_lakehouse"}'
  job-label: true

models:
  hexagone_bank_lakehouse:
    +persist_docs:
      relation: true
      columns: true
    staging:
      # Vues de nettoyage technique, une par source RAW (préfixe stg_)
      +materialized: view
      +schema: raw_bank
    silver:
      +materialized: table
      +schema: silver_bank
      customer_360:
        +labels:
          data_product: dp_customer_360
      customer_timeline:
        +labels:
          data_product: dp_customer_timeline
      customer_relationship:
        +labels:
          data_product: dp_customer_relationship
      finance_pnb:
        +labels:
          data_product: dp_finance_pnb
      commercial_commitments:
        +labels:
          data_product: dp_commercial_commitments
    gold:
      +materialized: table
      +schema: gold_bank
      budget_insight:
        +labels:
          data_product: dp_budget_insight

# Extraction IA des PDF (AI.GENERATE sur les Object Tables).
# gemini-2.5-flash n'est plus servi au projet : seul gemini-3-flash-preview répond, sur l'endpoint global.
vars:
  ai_connection: 'data-days-demo.europe-west1.biglake-gcs-conn'
  ai_endpoint: 'https://aiplatform.googleapis.com/v1/projects/data-days-demo/locations/global/publishers/google/models/gemini-3-flash-preview'

seeds:
  hexagone_bank_lakehouse:
    +schema: silver_bank
    +persist_docs:
      relation: true
      columns: true
    movement_category_rules:
      +column_types:
        priority: int64
    movement_categories:
      +schema: gold_bank
      +column_types:
        is_income: bool
        is_fixed_charge: bool
        is_variable_card: bool
        is_recurring_candidate: bool
        is_subscription: bool
        is_health_refund: bool
        is_organic_budget_flow: bool
        active_months_max: int64
    budget_insight_rules:
      +schema: gold_bank
      +column_types:
        min_safety_cushion_eur: numeric
        savings_rounding_step_eur: numeric
        subscription_hike_min_delta_eur: numeric
        min_recurring_months: int64
        min_timesfm_history_months: int64
        neobank_lookback_months: int64
        recent_event_lookback_days: int64
        regulated_priority_rank: int64
    savings_offer_catalog:
      +column_types:
        base_rate_bps: int64
        boosted_rate_bps: int64
        boost_duration_months: int64
        deposit_cap_eur: numeric
        priority_rank: int64
    pcec_accounts:
      +column_types:
        pcec_account: string
    promo_types:
      +column_types:
        pcec_account: string
