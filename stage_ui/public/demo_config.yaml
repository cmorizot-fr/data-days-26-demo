                question: Comment traiter le trailer CFT (`99CFT_TRL`) et le fichier `202610_RUN01.cfonb` (`ABEND_S0C7`) ?
                options:
                  - "(Recommended) Rejeter automatiquement tout fichier avec `RC != 0000` et vérifier `DATA_RECORDS` + `CHECKSUM_MVTS_04`"
                  - "Ingérer tous les fichiers sans filtrer le code retour CFT"
