                  def unpack_comp3(raw: bytes) -> int:
                      """Décode un champ binaire Mainframe Packed Decimal (COMP-3) signé en entier."""
                      hex_str = raw.hex()
                      digits = int(hex_str[:-1])
                      return -digits if hex_str[-1].lower() in ("d", "b") else digits

                  # 1. Lecture binaire fixe RECFM=FB sans '\n' (EBCDIC CP500 + COMP-3)
                  accounts_rdd = sc.binaryRecords(f"{raw_base_uri}/CBK_ACCOUNTS_MSTR_20261112.ebcdic", 150).mapPartitions(
                      lambda part: decode_account_partition(part, accounts_uri, ingest_ts)
                  )

                  # 2. Lecture parallèle des 19 lots CFONB (.cfonb.gz & .cfonb) :
                  #    - rejette RC != '0000' (écarte 202610_RUN01 en ABEND_S0C7 RC=0012)
                  #    - vérifie DATA_RECORDS & CHECKSUM_MVTS_04
                  #    - rattache en streaming chaque ligne '05' (BIC + EndToEndId) à son '04' parent
                  cfonb_tagged_rdd = (
                      sc.binaryFiles(f"{raw_base_uri}/CFONB120_MVTS_*", minPartitions=19)
                      .flatMap(lambda entry: parse_cfonb_file_entry(entry, ingest_ts))
                      .persist(StorageLevel.MEMORY_AND_DISK)
                  )

                  # 3. Écriture directe Storage Write API en mode append sur les tables BigLake Iceberg pré-documentées
                  (
                      movements_df.write.format("bigquery")
                      .option("table", f"{args.project_id}.{args.dataset}.cbk_cfonb_movements")
                      .option("writeMethod", "direct")
                      .mode("append")
                      .save()
                  )
