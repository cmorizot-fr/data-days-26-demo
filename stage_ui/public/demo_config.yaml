                    period_ym STRING OPTIONS (description = "Mois comptable du mouvement au format AAAAMM ('202506' à '202611')."),
                    code_op_interne STRING OPTIONS (description = "Code opération interne ('0420' salaire, '0580' vir interne 58*, '0810' SEPA Instant sortant, '0310' CB)."),
                    code_guichet_raw STRING OPTIONS (description = "Code guichet sur 5 car. conservé brut en RAW (12,08 % non normalisés '42   ' ou '     ')."),
                    num_compte_11 STRING OPTIONS (description = "Numéro de compte RIB sur 11 caractères (-> cbk_accounts_master.num_compte_11)."),
                    date_compta_raw STRING OPTIONS (description = "Date de comptabilisation AAAAMMJJ (pos 035-042)."),
                    date_valeur_raw STRING OPTIONS (description = "Date de valeur brute AAAAMMJJ conservée sans nettoyage en RAW (1,20 % soit 66 000 '00000000'/'99999999')."),
                    signed_amount_cents INT64 OPTIONS (description = "Montant signé décodé en centimes (-242 000 000 000 cts = -2,42 Md€ de fuite néobanques sur 90j)."),
                    signed_amount_eur NUMERIC OPTIONS (description = "Montant signé décodé en euros (signed_amount_cents / 100)."),
                    has_complement_05 BOOLEAN OPTIONS (description = "TRUE si suivi physiquement d'une ligne complémentaire SEPA '05'."),
                    counterparty_bic STRING OPTIONS (description = "BIC contrepartie extrait de la ligne '05' adjacente (REVOLT21XXX, TRBKDEBBXXX, BOURFRPPXXX...)."),
                    sepa_end_to_end_id STRING OPTIONS (description = "EndToEndId ISO 20022 extrait de la ligne '05' (jointure avec raw_sepa_payments_pubsub_stream).")
                    -- + 11 autres colonnes techniques & métadonnées documentées
                  )
                  CLUSTER BY period_ym, code_op_interne, counterparty_bic
