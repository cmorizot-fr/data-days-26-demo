                    SUBSTR(debtor.full_name, 1, 16) || '...' AS debtor_name_sha256,

                    -- 4. Texte libre (santé RGPD Art. 9 : pharmacie / CPAM) -> ALWAYS_NULL
                    remittance.unstructured_info AS remittance_art9_redacted
