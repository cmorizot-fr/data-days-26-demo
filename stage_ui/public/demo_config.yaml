            filesChanged:
              - path: 02_demo2_silver_dbt_dq/models/silver/commercial_commitments/promo_contracts.sql
                language: sql
                badge: DBT · AI.GENERATE
                added: 111
                removed: 0
                content: |-
                  {{ config(
                      materialized='incremental',
                      incremental_strategy='merge',
                      unique_key='promo_contract_id',
                      on_schema_change='append_new_columns',
                  ) }}

                  -- dp_commercial_commitments · promo_contracts : 1 ligne par avenant promotionnel d'agence (250 PDF).
                  -- Approche hybride :
                  --   * les champs certifiés (montant engagé, compte PCEC, dates) sont extraits UNE fois par AI.GENERATE
                  --     directement sur l'Object Table (aucune copie des PDF), puis testés par dbt (total = 14 300 000,00 EUR) ;
                  --   * chaque ligne garde son ObjectRef (source_pdf) : un agent peut rouvrir le PDF à la demande pour citer une clause.
                  -- Fiabilité : température 0, reprise immédiate des PDF en échec dans la même requête, puis à chaque run
                  -- seuls les PDF incomplets ou modifiés (md5) sont relus. Le suivi PDF par PDF est dans promo_contracts_pdf_tracking.
                  -- Le type de promotion n'est pas demandé au modèle : il est déduit du compte PCEC via le référentiel promo_types.

                  {% set existing_cols = [] %}
                  {% if is_incremental() %}
                      {% set existing_cols = adapter.get_columns_in_relation(this) | map(attribute='name') | list %}
                  {% endif %}
                  {% set has_tracking = 'is_extraction_complete' in existing_cols %}

                  WITH pdf AS (
                      SELECT p.promo_contract_id, p.region_code_hint, p.uri, p.md5_hash, p.updated_ts, p.ref
                      FROM {{ source('raw_bank', 'raw_promo_contracts_pdf') }} AS p
                      {% if has_tracking %}
                      -- PDF déjà extrait complètement dans sa version courante : on ne le relit pas,
                      -- sauf relance ciblée : dbt run -s promo_contracts --vars '{reextract_ids: [PROMO-2026-186]}'
                      WHERE NOT EXISTS (
                          SELECT 1 FROM {{ this }} AS t
                          WHERE t.promo_contract_id = p.promo_contract_id
                            AND t.source_md5_hash = p.md5_hash
                            AND t.is_extraction_complete
                      )
                      {% if var('reextract_ids', []) | length > 0 %}
                         OR p.promo_contract_id IN ('{{ var("reextract_ids") | join("', '") }}')
                      {% endif %}
                      {% endif %}
                      -- Sans colonnes de suivi (1er run ou table antérieure), les 250 PDF sont relus avec le prompt courant.
                  ),
                  first_pass AS (
                      SELECT pdf.*, {{ ai_extract_promo_contract('pdf.uri') }} AS ai
                      FROM pdf
                  ),
                  checked AS (
                      SELECT *, {{ promo_extraction_is_complete('ai', 'promo_contract_id') }} AS first_pass_ok
                      FROM first_pass
                  ),
                  extracted AS (
                      -- Reprise immédiate des réponses vides ou non conformes (quota, réponse illisible, champ manquant) :
                      -- la branche ELSE du IF n'est évaluée que pour les PDF en échec au premier passage.
                      SELECT
                          k.* EXCEPT (ai, first_pass_ok),
                          IF(k.first_pass_ok, k.ai, {{ ai_extract_promo_contract('k.uri') }}) AS ai,
                          IF(k.first_pass_ok, 1, 2)                                           AS run_attempts
                      FROM checked AS k
                  ),
                  {% if has_tracking %}
                  previous AS (
                      SELECT promo_contract_id, source_md5_hash, extraction_attempts
                      FROM {{ this }}
                  ),
                  {% endif %}
                  digital_cap AS (
                      -- Plafond ACPR 2024-R-01 du canal mobile, porté par l'offre Livret Boost Maison
                      SELECT boosted_rate_bps - base_rate_bps AS max_boost_bps, boost_duration_months AS max_boost_months
                      FROM {{ ref('savings_offer_catalog') }}
                      WHERE offer_code = 'LIV_BOOST_MAISON'
                  )
                  SELECT
                      e.promo_contract_id,
                      e.region_code_hint                                               AS region_code,
                      e.ai.primary_branch_code                                         AS agency_code,
                      pt.promo_type                                                    AS promo_type,
                      pt.promo_type_label                                              AS promo_type_label,
                      SAFE.PARSE_DATE('%Y-%m-%d', e.ai.effective_date)                 AS effective_date,
                      SAFE.PARSE_DATE('%Y-%m-%d', e.ai.end_date)                       AS end_date,
                      e.ai.duration_months                                             AS duration_months,
                      e.ai.boost_rate_bps                                              AS boost_rate_bps,
                      CAST(ROUND(e.ai.welcome_bonus_eur, 2) AS NUMERIC)                AS welcome_bonus_eur,
                      CAST(ROUND(e.ai.committed_promo_cost_eur, 2) AS NUMERIC)         AS committed_promo_cost_eur,
                      e.ai.pcec_account                                                AS pcec_account,
                      e.ai.boost_rate_bps > 0
                          AND (e.ai.boost_rate_bps > c.max_boost_bps
                               OR e.ai.duration_months > c.max_boost_months)           AS exceeds_acpr_digital_cap,
                      -- Suivi de l'extraction
                      {{ promo_extraction_is_complete('e.ai', 'e.promo_contract_id') }} AS is_extraction_complete,
                      e.ai.status                                                      AS extraction_status,
                      IF({{ promo_extraction_is_complete('e.ai', 'e.promo_contract_id') }}, NULL,
                         SUBSTR(TO_JSON_STRING(e.ai.full_response), 1, 1000))         AS extraction_error_detail,
                      e.ai.contract_reference                                          AS extracted_contract_reference,
                      {% if has_tracking %}
                      -- Tentatives cumulées sur la version courante du PDF (remise à zéro si le PDF change)
                      e.run_attempts + IF(pv.source_md5_hash = e.md5_hash, COALESCE(pv.extraction_attempts, 0), 0)
                      {% else %}
                      e.run_attempts
                      {% endif %}                                                      AS extraction_attempts,
                      '{{ var("ai_endpoint").split("/")[-1] }}'                        AS extraction_model,
                      CURRENT_TIMESTAMP()                                              AS extracted_at,
                      -- Lien vers le PDF source. Lecture à la demande : AI.GENERATE((question, OBJ.MAKE_REF(source_uri)), ...) sur une seule ligne
                      -- (accès direct : les URL signées de source_pdf ne traversent pas le périmètre VPC Service Controls)
                      e.ref                                                            AS source_pdf,
                      e.uri                                                            AS source_uri,
                      e.md5_hash                                                       AS source_md5_hash,
                      e.updated_ts                                                     AS source_updated_at
                  FROM extracted AS e
                  CROSS JOIN digital_cap AS c
                  LEFT JOIN {{ ref('promo_types') }} AS pt ON pt.pcec_account = e.ai.pcec_account
                  {% if has_tracking %}
                  LEFT JOIN previous AS pv USING (promo_contract_id)
                  {% endif %}
              - path: 02_demo2_silver_dbt_dq/macros/ai_extract_promo_contract.sql
                language: sql
                badge: MACRO
                added: 42
                removed: 0
                content: |-
                  {#
                    Extraction IA d'un avenant promotionnel PDF lu directement dans GCS (ObjectRef, aucune copie).
                    Utilisée deux fois par promo_contracts : premier passage, puis reprise immédiate des PDF en échec dans la même requête.
                    Température 0 : même PDF -> même réponse (extraction reproductible et testable au centime).
                    Accès direct (OBJ.MAKE_REF(uri) sans connexion) : les URL signées de l'Object Table (OBJ.GET_ACCESS_URL)
                    ne traversent pas le périmètre VPC Service Controls du projet et faisaient échouer une partie des PDF.
                  #}
                  {% macro ai_extract_promo_contract(object_uri) %}
                  AI.GENERATE(
                      ('''Tu es contrôleur de gestion. Lis cet avenant promotionnel d'agence bancaire (PDF d'une page) et renvoie uniquement les champs demandés.
                  - contract_reference : la référence de l'avenant, au format PROMO-AAAA-NNN ;
                  - primary_branch_code : le code de l'agence principale signataire, 4 chiffres (le premier code agence cité) ;
                  - effective_date : la date d'effet, de signature ou d'arrêté de l'avenant, au format AAAA-MM-JJ ;
                  - end_date : la date d'échéance ou de fin, au format AAAA-MM-JJ (vide si absente) ;
                  - duration_months : la durée en mois (0 si absente) ;
                  - boost_rate_bps : la bonification de taux en points de base, par exemple 150 pour +150 bps (0 si aucune) ;
                  - welcome_bonus_eur : la prime unitaire d'ouverture de compte par client en euros (0 si aucune) ;
                  - committed_promo_cost_eur : le montant TOTAL engagé par l'avenant (coût commercial net, engagement PNB ou impact PNB), en euros, nombre positif avec 2 décimales ;
                  - pcec_account : le compte PCEC d'imputation, 6 chiffres.
                  Les montants français utilisent l'espace ou le point comme séparateur de milliers et la virgule comme séparateur décimal.
                  Les dates françaises sont au format JJ/MM/AAAA (jour d'abord) : 05/09/2026 est le 5 septembre 2026.''',
                       OBJ.MAKE_REF({{ object_uri }})),
                      connection_id => '{{ var("ai_connection") }}',
                      endpoint => '{{ var("ai_endpoint") }}',
                      model_params => JSON '{"generation_config": {"temperature": 0}}',
                      output_schema => '''contract_reference STRING, primary_branch_code STRING, effective_date STRING, end_date STRING,
                          duration_months INT64, boost_rate_bps INT64, welcome_bonus_eur FLOAT64,
                          committed_promo_cost_eur FLOAT64, pcec_account STRING'''
                  )
                  {% endmacro %}


                  {# Une extraction n'est complète que si l'appel a réussi ET que les champs certifiés sont présents et cohérents. #}
                  {% macro promo_extraction_is_complete(ai, contract_id) %}
                  COALESCE(
                      {{ ai }}.status = ''
                      AND {{ ai }}.committed_promo_cost_eur > 0
                      AND REGEXP_CONTAINS({{ ai }}.pcec_account, r'^[0-9]{6}$')
                      AND {{ ai }}.contract_reference = {{ contract_id }},
                      FALSE
                  )
                  {% endmacro %}
              - path: 02_demo2_silver_dbt_dq/models/silver/commercial_commitments/promo_contracts_pdf_tracking.sql
                language: sql
                badge: TRACKING VIEW
                added: 47
                removed: 0
                content: |-
                  {{ config(materialized='view') }}

                  -- dp_commercial_commitments · promo_contracts_pdf_tracking : suivi d'extraction PDF par PDF.
                  -- Part de l'Object Table (tous les PDF présents dans GCS, y compris ceux jamais traités) et y rattache
                  -- le résultat de promo_contracts : statut, tentatives, erreur, montant extrait et contrôles de cohérence.
                  -- Vue : toujours à jour, sans aucun appel au modèle IA.
                  SELECT
                      p.promo_contract_id,
                      p.region_code_hint                                                 AS region_code,
                      CASE
                          WHEN c.promo_contract_id IS NULL           THEN 'PENDING'      -- PDF arrivé, jamais extrait
                          WHEN c.source_md5_hash != p.md5_hash       THEN 'OUTDATED'     -- PDF modifié depuis l'extraction
                          WHEN NOT c.is_extraction_complete          THEN 'FAILED'       -- extraction vide ou non conforme
                          ELSE 'EXTRACTED'
                      END                                                                AS tracking_status,
                      c.extraction_attempts,
                      c.extracted_at                                                     AS last_extracted_at,
                      c.extraction_model,
                      c.extraction_status,
                      c.extraction_error_detail,
                      -- Champs certifiés extraits
                      c.agency_code,
                      c.promo_type,
                      c.pcec_account,
                      c.effective_date,
                      c.end_date,
                      c.committed_promo_cost_eur,
                      -- Contrôles de cohérence (aucune règle métier codée en dur : référentiels pcec_accounts et promo_types)
                      c.promo_type IS NOT NULL                                           AS is_promo_type_known,
                      COALESCE(NOT a.is_in_sap_gl, FALSE)                                AS is_pcec_off_sap_gl,
                      c.end_date IS NULL OR c.end_date >= c.effective_date               AS is_period_consistent,
                      COALESCE(
                          c.is_extraction_complete
                          AND c.source_md5_hash = p.md5_hash
                          AND c.promo_type IS NOT NULL
                          AND NOT a.is_in_sap_gl,
                          FALSE
                      )                                                                  AS is_certifiable,
                      -- PDF source, à rouvrir à la demande : AI.GENERATE((question, OBJ.MAKE_REF(source_uri)), ...) sur cette seule ligne
                      p.ref                                                              AS source_pdf,
                      p.uri                                                              AS source_uri,
                      p.size_bytes                                                       AS source_size_bytes,
                      p.md5_hash                                                         AS source_md5_hash,
                      p.updated_ts                                                       AS source_updated_at
                  FROM {{ source('raw_bank', 'raw_promo_contracts_pdf') }} AS p
                  LEFT JOIN {{ ref('promo_contracts') }} AS c USING (promo_contract_id)
