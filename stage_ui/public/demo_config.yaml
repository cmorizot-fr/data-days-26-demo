                  50,CARREFOUR|LECLERC|MONOPRIX,GROCERIES,CARD_SPENDING
                  51,SNCF|TOTALENERGIES,TRANSPORT,CARD_SPENDING
                  52,BOULANGERIE|RESTAURANT,FOOD_OUT,CARD_SPENDING
                  53,AMAZON|FNAC,SHOPPING,CARD_SPENDING
                  54,PHARMACIE,HEALTH_SPENDING,CARD_SPENDING
                  99,.*,OTHER,OTHER
