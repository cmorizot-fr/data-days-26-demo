            intermediateMessage: J'ai inspecté le dataset `data-days-demo.raw_bank`, le bucket `gs://data-days-demo-landing/RAW/corebanking/` (`25` objets, `969 Mo`) et analysé les 3 Copybooks COBOL (`CBK_CUSTOMERS_REF.cpy`, `CBK_ACCOUNTS_MSTR.cpy`, `CFONB120_BAL_OPS.cpy`).
            taskFinishedLabel: COBOL copybooks & Dataproc Serverless BigLake Iceberg diagnosis ready
            leadConfirmation: "Un chargement natif `bq load` est impossible ici : il faut exécuter un batch **PySpark sur Dataproc Serverless (`gcp-spark`)** pour décoder le binaire z/OS et alimenter **4 tables BigLake Managed Iceberg** documentées dans"
            leadLink:
              text: bigquery.cloud.google.com/dataset/data-days-demo:raw_bank
              url: https://console.cloud.google.com/bigquery?project=data-days-demo
            sectionHeading: "Pourquoi Spark Serverless est indispensable & 3 arbitrages à me confirmer :"
            items:
              - title: "1. Pourquoi `bq load` échoue & rejet automatique du `RUN01` en `ABEND`"
                chips:
                  - kind: py
                    label: CFONB120_BAL_OPS.cpy
                bullets:
                  - "Les maîtres `.ebcdic` sont en flux binaire continu `RECFM=FB` **sans saut de ligne `\\n`**, encodés en `EBCDIC CP500` mêlé à des décimaux condensés signés `COMP-3` (`2`, `3` et `8` octets). De plus, sur octobre 2026, `CFONB120_MVTS_202610_RUN01.cfonb` porte un trailer `99CFT_TRL STATUS=ABEND_S0C7 RC=0012` : je rejette automatiquement tout fichier avec `RC != 0000` et je vérifie `DATA_RECORDS` + `CHECKSUM_MVTS_04` ?"
              - title: "2. Rattachement positionnel `CFONB 04 + 05` & 4 tables BigLake Managed Iceberg documentées"
                chips:
                  - kind: bq
                    label: biglake-gcs-conn
                bullets:
                  - "Dans la norme `CFONB 120`, le `BIC` contrepartie et l'`EndToEndId` SEPA figurent sur une ligne complémentaire `05` placée physiquement sous sa ligne mouvement `04` sans clé répétée. Je pré-crée et documente 4 tables **BigLake Managed Iceberg** (`cbk_customers_ref`, `cbk_accounts_master`, `cbk_cfonb_balances` `01`/`07`, `cbk_cfonb_movements` `04+05`) via une connexion Cloud Resource `biglake-gcs-conn` (`europe-west1`) avant l'écriture Spark ?"
              - title: "3. Préservation stricte des anomalies métier en couche `RAW` & exécution Serverless"
                bullets:
                  - "Les relevés contiennent `~1,20 %` (`66 000`) de dates de valeur `00000000` / `99999999`, `12,08 %` de codes guichets décalés (`'42   '`) et `650` comptes récents AWS absents du Mainframe. On conserve 100 % de ces valeurs brutes intactes en `RAW` (pour les auditer avec `dbt` + Auto Data Quality en `Démo #2`) et on soumet sur **Dataproc Serverless runtime `2.2`** (`europe-west1`) ?"
            askQuestions:
